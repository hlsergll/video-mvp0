
name: Render Test Video

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-test
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create output directory
        run: mkdir -p out

      - name: Render video
        run: npm run render

      - name: Post-process video
        run: bash scripts/postprocess.sh

      - name: Inspect video
        run: bash scripts/ffprobe-report.sh out/test-5s-final.mp4

      - name: Verify video
        run: bash scripts/verify-output.sh

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: test-5s-video
          path: out/test-5s-final.mp4
          retention-days: 1
